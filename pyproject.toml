[build-system]
requires = ["flit_core >=3.12.0,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "glomar_gridding"
# version = "1.1.0"
dependencies = [
  "cf-xarray>=0.11.3",
  "geopandas",
  "netCDF4",
  "numpy!=2.2.6",
  "pandas",
  "polars",
  "pyarrow",
  "pyyaml>=6.0.2",
  "scikit-learn",
  "scipy",
  "statsmodels>=0.14.4",
  "tqdm",
  "xarray",
]
requires-python = ">=3.11"
authors = [
  { name = "Joseph Siddons", email = "josidd@noc.ac.uk" },
  { name = "Agnieszka Faulkner", email = "agfaul@noc.ac.uk" },
  { name = "Richard Cornes", email = "rcornes@noc.ac.uk" },
  { name = "Steven Chan", email = "stchan@noc.ac.uk" },
]
maintainers = [
  { name = "Joseph Siddons", email = "josidd@noc.ac.uk" },
  { name = "Agnieszka Faulkner", email = "agfaul@noc.ac.uk" },
  { name = "Steven Chan", email = "stchan@noc.ac.uk" },
]
description = "National Oceanography Centre library for performing gridding."
readme = "README.md"
license-files = ["LICENSE"]
keywords = [
  "gridding",
  "kriging",
  "ordinary",
  "simple",
  "interpolation",
  "covariance",
  "observations",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dynamic = ["version"]

[tool.bumpversion]
current_version = "1.1.0"
commit = false
allow_dirty = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]

[[tool.bumpversion.files]]
filename = "glomar_gridding/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "docs/conf.py"
search = "release = \"{current_version}\""
replace = "release = \"{new_version}\""

[tool.bumpversion.parts.build]
independent = false

[tool.bumpversion.parts.release]
optional_value = "release"
values = ["dev", "release"]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py311"
exclude = [".eggs", ".git", ".venv", "build", "venv"]

[tool.ruff.lint]
extend-select = [
  "RUF022", # unsorted-dunder-all
]
ignore = [
  "D205", # blank-line-after-summary
  "D400", # ends-in-period
  "D401", # non-imperative-mood
  "D105", # missing docstring in magic method
]
preview = true
select = [
  "C90",  # mccabe-complexity
  "D",    # docstrings
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "ICN",  # Flake8 Import Conventions
  "N802", # invalid-function-name
  "S",    # bandit
  "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"docs/*.py" = ["D100", "D101", "D102", "D103"]
"test/**/*test*.py" = ["D100", "D101", "D102", "D103", "N802", "S101", "S311"]
"notebooks/*.ipynb" = ["D100", "D101", "D102", "D103", "N802", "S101", "S311"]

[tool.ruff.format]
quote-style = "double"            # Like Black, use double quotes for strings.
indent-style = "space"            # Like Black, indent with spaces, rather than tabs.
skip-magic-trailing-comma = false # Like Black, respect magic trailing commas.
line-ending = "auto"              # Like Black, automatically detect the appropriate line ending.

[tool.pytest]
testpaths = ["./test"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-import-conventions.aliases]
"matplotlib.pyplot" = "plt"
numpy = "np"
pandas = "pd"
polars = "pl"
scipy = "sp"
xarray = "xr"
netCDF4 = "nc"

[project.urls]
Repository = "https://github.com/NOCSurfaceProcesses/GloMarGridding"

[dependency-groups]
notebooks = ["ipykernel", "matplotlib", "Cartopy"]
docs = [
  "sphinx>=8.2.0",
  "sphinx-autodoc-typehints>=3.1.0",
  "sphinx-rtd-theme>=3.0.2",
]
test = [
  "coverage[toml] >=7.13.4",
  "pytest >=9.0.2",
  "pytest-cov >=7.0.0",
  "pytest-env >=1.1.5",
]
lint = [
  # Linting tools
  "codespell >=2.4.2",
  "numpydoc >=1.10.0",
  "ruff >=0.15.11",
]
dev = [
  # Development and testing tools
  "pre-commit",
  "bump-my-version >=1.3.0",
  { include-group = "docs" },
  # { include-group = "notebooks" },
  { include-group = "lint" },
  { include-group = "test" },
]

[tool.numpydoc_validation]
checks = [
  "all",  # report on all checks, except the below
  "EX01",
  "SA01",
  "ES01",
]
# remember to use single quotes for regex in TOML
exclude = [
  # don't report on objects that match any of these regex
  '\.undocumented_method$',
  '\.__repr__$',
]
override_SS05 = [
  # override SS05 to allow docstrings starting with these words
  '^Process ',
  '^Assess ',
  '^Access ',
]

[tool.flit.sdist]
include = [
  "CHANGES.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "README.md",
  "docs/**/*.rst",
  "docs/Makefile",
  "docs/conf.py",
  "docs/make.bat",
  "test/**/*.py",
  "glomar_gridding/**/*.py",
]
exclude = ["**/*.py[co]", "**/__pycache__", ".*", "doc/_*", "pylintrc"]
